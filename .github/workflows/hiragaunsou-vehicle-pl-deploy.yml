name: hiragaunsou-vehicle-pl Deploy

# mainブランチへのマージ(push)をトリガーに本番Cloudflare Workersへデプロイする。
# ビルド/設定確認 → D1マイグレーション → コードデプロイ → 稼働確認の順で実行する。
on:
  push:
    branches: [main]
    paths:
      - "hiragaunsou-vehicle-pl-extracted/app/**"
      - "hiragaunsou-vehicle-pl-extracted/src/**"
      - "hiragaunsou-vehicle-pl-extracted/migrations/**"
      - "hiragaunsou-vehicle-pl-extracted/package.json"
      - "hiragaunsou-vehicle-pl-extracted/pnpm-lock.yaml"
      - "hiragaunsou-vehicle-pl-extracted/wrangler.jsonc"
      - "hiragaunsou-vehicle-pl-extracted/open-next.config.ts"
      - "hiragaunsou-vehicle-pl-extracted/next.config.ts"
      - ".github/workflows/hiragaunsou-vehicle-pl-deploy.yml"
  # 手動での再デプロイ用(マイグレーション未変更でコードだけ再送したい場合等)
  workflow_dispatch:
    inputs:
      allow_destructive_migration:
        description: '破壊的マイグレーション(DROP/DELETE等)の適用を承認する場合のみ YES と入力'
        required: false
        default: ''

# GITHUB_TOKENはチェックアウトのみに使う。Cloudflareへの書き込みはCLOUDFLARE_API_TOKEN(Secrets)を使う。
permissions:
  contents: read

# D1マイグレーションとWorkersデプロイは並行実行させない。cancelすると途中状態を残すためfalse。
concurrency:
  group: hiragaunsou-vehicle-pl-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiragaunsou-vehicle-pl-extracted

jobs:
  deploy:
    name: migrate + build + deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      APP_ORIGIN: ${{ vars.HIRAGAUNSOU_APP_ORIGIN || 'https://hiragaunsou-vehicle-pl.daishimanju.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      # CI と同じ pnpm を使う。ここだけ別のものを使うと「CIは緑なのにデプロイが落ちる」。
      # アプリの package.json はリポジトリ直下ではなくサブフォルダにある。
      # 場所を教えないと packageManager を読めず「pnpm のバージョンが分からない」で止まる。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hiragaunsou-vehicle-pl-extracted/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hiragaunsou-vehicle-pl-extracted/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage gate
        run: pnpm run coverage

      - name: Build (OpenNext for Cloudflare)
        run: pnpm run cf:build

      # OpenNext生成物を含むworker型を生成できることを検証する。
      # `--check` はRunnerごとのOpenNext出力差でハッシュが非決定的になるため使わない。
      - name: Generate Cloudflare types
        run: pnpm run cf-typegen

      - name: Verify production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          case "$APP_ORIGIN" in https://*) ;; *) echo "HIRAGAUNSOU_APP_ORIGIN must use https"; exit 1;; esac
          if grep -Fq '"WORKSPACE_DOMAINS": "example.co.jp"' wrangler.jsonc; then
            echo "WORKSPACE_DOMAINS is still the placeholder. Set the actual Google Workspace domain before production deployment."
            exit 1
          fi

      - name: Verify Worker bundle (dry run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --dry-run

      # コードのデプロイは wrangler rollback で戻せるが、DBの構造変更は戻せない。
      # 「レビューで人が気づく」ことに依存せず、適用される直前に機械で止める。
      # 未適用のマイグレーションだけを検査するため、適用済みの DROP INDEX では止まらない。
      - name: Guard against destructive migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ inputs.allow_destructive_migration }}
        run: bash ../.github/scripts/guard-destructive-migrations.sh hiragaunsou_vehicle_pl migrations

      # D1マイグレーションは d1_migrations テーブルで適用簿管理されるため冪等。
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply hiragaunsou_vehicle_pl --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Verify D1 migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations list hiragaunsou_vehicle_pl --remote

      # 「デプロイ成功」はファイルが届いたことしか意味しない。必ず本番URLを叩いて確かめる。
      # Cloudflare は旧バージョンの実行環境(isolate)を1〜2分保持するため、
      # 間隔を空けて2回叩き、両方通ったときだけ成功とする(1回だけだと古い応答で誤判定する)。
      - name: Smoke test deployed application
        run: bash ../.github/scripts/smoke.sh

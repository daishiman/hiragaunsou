name: hiragaunsou-vehicle-pl CI

# PR作成・更新時に typecheck / test を自動実行する。
#
# あえて paths フィルタを付けていない。このCIはmainブランチ保護の必須チェックであり、
# パスで絞ると docs/ や aidd-agent-kit/ だけを変更したPRでワークフローが起動せず、
# GitHubが「報告待ち」のまま永久にマージをブロックしてしまうため。
# このリポジトリはpublicでActionsが無料・無制限なので、常時実行のコストは無い。
on:
  pull_request:
    branches: [main]

# GITHUB_TOKENの権限は最小(読み取りのみ)。デプロイ等の書き込みはCDワークフロー側でのみ許可する。
permissions:
  contents: read

# 同じPRへの連続pushで古い検証を走らせ続けない。main以外は新しいrunを優先する。
concurrency:
  group: hiragaunsou-vehicle-pl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hiragaunsou-vehicle-pl-extracted

jobs:
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hiragaunsou-vehicle-pl-extracted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # coverageはthresholds(statements/branches/functions/lines 80%)を下回るとexit 1になるため、
      # PRゲートとしてそのまま利用する(vitest.config.tsのcoverage.thresholds参照)。
      - name: Test with coverage gate
        run: npm run coverage

      - name: Build for Cloudflare
        run: npm run cf:build

      # OpenNext生成物を含むworker型を生成できることを検証する。
      # `--check` はRunnerごとのOpenNext出力差でハッシュが非決定的になるため使わず、
      # 型安全性は上記のTypecheckとCloudflare本番ビルドで担保する。
      - name: Generate Cloudflare types
        run: npm run cf-typegen

      # 本番依存だけを対象に、High/Criticalの既知脆弱性をリリースゲートにする。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # セッションテーブル等が無いとgetServerSession()内のクエリ自体が失敗するため、
      # ローカルD1にもマイグレーションを適用してから起動する。
      - name: Apply D1 migrations (local, for E2E)
        run: npm run db:migrate:local

      # Google OAuth自体は呼ばない(招待経由のメール/パスワード作成パスでログイン後の画面も検証する)ため、
      # secretsはcreateAuth()の初期化が落ちないためのダミー値で足りる。
      # BETTER_AUTH_URLはtrustedOriginsの判定に使われるため、webServerが起動する
      # http://localhost:3000 と一致させないと sign-in が Invalid origin で失敗する。
      - name: E2E smoke test
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-for-real-auth
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
        run: npm run test:e2e

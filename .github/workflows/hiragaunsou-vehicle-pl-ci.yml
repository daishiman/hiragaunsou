name: hiragaunsou-vehicle-pl CI

# PR作成・更新時に typecheck / test を自動実行する。
#
# あえて paths フィルタを付けていない。このCIはmainブランチ保護の必須チェックであり、
# パスで絞ると docs/ や aidd-agent-kit/ だけを変更したPRでワークフローが起動せず、
# GitHubが「報告待ち」のまま永久にマージをブロックしてしまうため。
# このリポジトリはpublicでActionsが無料・無制限なので、常時実行のコストは無い。
on:
  # 積み上げPRでも品質ゲートを省略しない。mainの必須チェックとして使いつつ、
  # 中間ブランチ向けPRも同じ条件で先に検証する。
  pull_request:

# GITHUB_TOKENの権限は最小(読み取りのみ)。デプロイ等の書き込みはCDワークフロー側でのみ許可する。
permissions:
  contents: read

# 同じPRへの連続pushで古い検証を走らせ続けない。main以外は新しいrunを優先する。
concurrency:
  group: hiragaunsou-vehicle-pl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hiragaunsou-vehicle-pl-extracted

jobs:
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest
    # 文字の重なり検査を足したぶん、20分では足りなくなった。
    # 手元(Apple Silicon)の実測は認証後catalog全件×4幅 + グラフで1.5分。
    # CIは全E2Eを1 workerで直列実行し、失敗時のretryもあるため余裕を持たせる。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # パッケージマネージャは pnpm 1本。手元と CI で別のものを使うと、依存を1つ足したとき
      # 片方のロックファイルだけが更新され、手元の品質ゲートが全部通っているのに
      # CI だけ install で落ちる (実際に起きた)。バージョンは package.json の
      # packageManager から読ませ、ここには書かない (2箇所に持つと片方だけ古くなる)。
      # アプリの package.json はリポジトリ直下ではなくサブフォルダにある。
      # 場所を教えないと packageManager を読めず「pnpm のバージョンが分からない」で止まる。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hiragaunsou-vehicle-pl-extracted/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hiragaunsou-vehicle-pl-extracted/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # coverageはthresholds(statements/branches/functions/lines 80%)を下回るとexit 1になるため、
      # PRゲートとしてそのまま利用する(vitest.config.tsのcoverage.thresholds参照)。
      - name: Test with coverage gate
        run: pnpm run coverage

      - name: Build for Cloudflare
        run: pnpm run cf:build

      # OpenNext生成物を含むworker型を生成できることを検証する。
      # `--check` はRunnerごとのOpenNext出力差でハッシュが非決定的になるため使わず、
      # 型安全性は上記のTypecheckとCloudflare本番ビルドで担保する。
      - name: Generate Cloudflare types
        run: pnpm run cf-typegen

      # 本番依存だけを対象に、High/Criticalの既知脆弱性をリリースゲートにする。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # セッションテーブル等が無いとgetServerSession()内のクエリ自体が失敗するため、
      # ローカルD1にもマイグレーションを適用してから起動する。
      - name: Apply D1 migrations (local, for E2E)
        run: pnpm run db:migrate:local

      # Google OAuth自体は呼ばない(招待経由のメール/パスワード作成パスでログイン後の画面も検証する)ため、
      # secretsはcreateAuth()の初期化が落ちないためのダミー値で足りる。
      # BETTER_AUTH_URLはtrustedOriginsの判定に使われるため、webServerが起動する
      # http://localhost:3000 と一致させないと sign-in が Invalid origin で失敗する。
      #
      # 「文字の重なり」だけ独立した1ステップにしてある。認証後の画面カタログを総当たりするため、
      # 他のE2Eに埋めると「どこが壊れたのか」がログの中で埋もれる。
      # 検査器自身の数値判定は、最大・境界値を含む単体テストと100% coverageに固定する。
      - name: 文字重なり判定の境界値 (100% coverage)
        run: pnpm run test:coverage:overlap-geometry

      # 順番は通常E2Eより先。見た目が壊れているPRは、
      # その後の業務フローE2Eが終わるのを待たずに落とす。
      - name: 文字の重なり検査 (認証後画面カタログ + グラフ)
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-for-real-auth
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
        run: pnpm run test:e2e:overlap

      # 重なり検査で失敗したとき、どう重なっていたのかを画像で残す
      # (失敗メッセージの文字だけでは、意図した重ねなのかの判断がつかないことがある)。
      - name: Upload overlap screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: text-overlap-screenshots
          path: hiragaunsou-vehicle-pl-extracted/test-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: E2E smoke test
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-for-real-auth
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
        run: pnpm run test:e2e -- --grep-invert @overlap
